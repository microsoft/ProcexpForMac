name: ProcexpMac
options:
  bundleIdPrefix: com.sysinternals
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Procexp:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES

targets:
  ProcexpMac:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: Procexp
        product: ProcexpModel
      - package: Procexp
        product: ProcexpSampling
      - package: Procexp
        product: ProcexpSigning
      - package: Procexp
        product: ProcexpNetwork
      - package: Procexp
        product: ProcexpGraphs
      - package: Procexp
        product: ProcexpAutostart
      - package: Procexp
        product: ProcexpActions
      - package: Procexp
        product: ProcexpPrivileged
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sysinternals.procexpmac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Process Explorer for macOS"
        INFOPLIST_KEY_CFBundleDisplayName: "Process Explorer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
